name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle 8.6
      run: |
        curl -L --retry 3 --retry-delay 5 -o gradle.zip https://services.gradle.org/distributions/gradle-8.6-bin.zip
        unzip -q gradle.zip
        echo "$PWD/gradle-8.6/bin" >> $GITHUB_PATH
        gradle --version

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: larkplayer-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        if-no-files-found: error

    - name: Upload mapping & reports (debug)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: larkplayer-build-reports
        path: |
          app/build/reports/**
          app/build/outputs/logs/**
        retention-days: 7
        if-no-files-found: ignore
